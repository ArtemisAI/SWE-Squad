# =============================================================================
# Autonomous SWE Team Configuration
# =============================================================================
# Controls the self-healing development agents that monitor, triage,
# investigate, fix, test, and deploy changes autonomously.
#
# Environment variable overrides: SWE_TEAM_CONFIG (path), SWE_TEAM_ENABLED
# =============================================================================

# ---------------------------------------------------------------------------
# Managed Repositories (local clones used by investigator and developer)
# ---------------------------------------------------------------------------
repos:
  - name: "ArtemisAI/LinkedAi"
    local_path: "/home/agent/Projects/LinkedAi"
    description: "Primary product — LinkedIn automation pipeline"
  - name: "ArtemisAI/SWE-Squad-DEV"
    local_path: "/home/agent/SWE-Squad"
    description: "This repo — autonomous SWE agent system"
  - name: "ArtemisAI/dan-ai.pro"
    local_path: "/home/agent/Projects/dan-ai.pro"
    description: "Portfolio site — dan-ai.pro (monitor + GitHub Issues; clone if dev needed)"
    monitor_only: true
  - name: "ArtemisAI/artemis-ai-ca"
    local_path: "/home/agent/Projects/artemis-ai-ca"
    description: "Portfolio site — artemis-ai.ca (monitor + GitHub Issues; clone if dev needed)"
    monitor_only: true

# Kill switch — set to true to activate SWE team agents.
# Override via environment variable: SWE_TEAM_ENABLED=true
enabled: false

# Team identity — scopes tickets so multiple SWE teams don't overlap.
# Override via: SWE_TEAM_ID, SWE_GITHUB_ACCOUNT
team_id: "default"
github_account: ""        # Dedicated GitHub bot account for this team

# A2A hub for inter-agent communication
a2a_hub_url: "http://100.110.176.73:18790"

# Persistent ticket storage (JSON file, lightweight default).
# Set SUPABASE_URL + SUPABASE_ANON_KEY in .env to use Supabase instead.
ticket_store_path: "data/swe_team/tickets.json"

# ---------------------------------------------------------------------------
# Ralph-Wiggum Stability Gate
# ---------------------------------------------------------------------------
governance:
  enabled: true
  max_open_critical: 40       # Raised 2026-03-18 — was 20, permanently blocked at 32 critical
  max_open_high: 80           # Raised 2026-03-18 — was 50, permanently blocked at 64 high
  max_failing_tests: 0        # Block if any test failures
  require_ci_green: false     # Don't block on CI — CI not configured for LinkedAi yet
  check_interval_hours: 6     # Run stability check every 6 hours

# ---------------------------------------------------------------------------
# Error Monitor
# ---------------------------------------------------------------------------
monitor:
  enabled: true
  scan_interval_minutes: 30
  dedup_window_hours: 72
  log_directories:
    - "logs/"
  log_patterns:
    - "ERROR"
    - "CRITICAL"
    - "Traceback"
    - "FAILED"
    - "reCAPTCHA"
    - "TimeoutError"
  exclude_patterns:
    - "swe_team"
    - "swe_team_runner"
  remote_workers:
    # LinkedAi production worker nodes (Tailscale network)
    # SSH via scoped config: config/ssh_workers.conf (IdentitiesOnly, dedicated key)
    # browser-1 excluded — no log directory on that node
    - name: linkedai-browser-2
      ssh: "linkedai-browser-2"
      log_dir: "~/Projects/LinkedAi/logs"
    - name: linkedai-bot-2
      ssh: "linkedai-bot-2"
      log_dir: "~/Projects/LinkedAi/logs"
    - name: linkedai-hp-laptop
      ssh: "linkedai-hp-laptop"
      log_dir: "~/Projects/LinkedAi/logs"

# ---------------------------------------------------------------------------
# Per-Cycle Throttle
# ---------------------------------------------------------------------------
# Controls how aggressively the squad processes the backlog each cycle.
# Tune these to balance cost vs throughput.
cycle:
  # Only pick up tickets at this severity or higher each cycle.
  # Values: low | medium | high | critical
  severity_filter: "high"

  # Max new tickets to triage in a single cycle (highest severity first).
  # Remaining tickets are deferred to the next cycle.
  max_new_tickets_per_cycle: 10

  # Max tickets to investigate per cycle (each = 1 Claude CLI call).
  max_investigations_per_cycle: 5

  # Max tickets to attempt a fix on per cycle (each = 1+ Claude CLI calls).
  max_developments_per_cycle: 4

  # Hard cap on concurrent INVESTIGATING tickets across all cycles.
  # New investigations are skipped when this limit is in use.
  max_open_investigating: 5

# ---------------------------------------------------------------------------
# Model Cost Tiers
# ---------------------------------------------------------------------------
# Route tasks to the right model tier for cost efficiency.
# Override via environment variables: T1_MODEL, T2_MODEL, T3_MODEL
models:
  t1_heavy: "opus"      # Architecture, orchestration, critical bugs
  t2_standard: "sonnet"  # Feature implementation, routine fixes
  t3_fast: "haiku"       # Docs, scanning, simple tasks

# ---------------------------------------------------------------------------
# Rate Limit Backoff
# ---------------------------------------------------------------------------
# Exponential backoff when Claude Code CLI returns 429 rate limit errors.
rate_limits:
  max_retries_on_429: 3
  initial_backoff_seconds: 30
  max_backoff_seconds: 300

# ---------------------------------------------------------------------------
# Multi-Agent Fallback Chain (A2A integration)
# ---------------------------------------------------------------------------
# When Claude Code is rate-limited, these agents are tried in priority order.
# Each agent wraps a CLI tool as an A2A-compatible agent.
# Priority: lower number = tried first.
fallback_agents:
  - name: "gemini-cli"
    command: "/usr/bin/gemini"
    args_template: ["-p", "{prompt}"]
    default_model: "gemini-2.5-flash-thinking"   # proven working; 1M context window
    enabled: true                                 # ACTIVE — installed at /usr/bin/gemini
    priority: 50
    timeout: 180          # Gemini can be slow on large prompts
    prompt_via_stdin: false
    skills:
      - "investigate"    # log analysis, library research, public API docs
      - "review"         # code review of non-proprietary diffs
      - "dashboard"      # WebUI / HTML / CSS / chart generation (Gemini excels at web design)
      - "websearch"      # external docs, CVE lookup, RFC research
    # DATA RETENTION WARNING: Do not forward proprietary source code or PII.
    # The GeminiCLIAdapter sanitises prompts before sending.
    # Needs Playwright for dashboard rendering tests — install: npx playwright install chromium

  - name: "opencode"
    command: "/usr/local/bin/opencode"
    args_template: ["run", "-m", "{prompt}"]
    default_model: ""
    enabled: false        # not installed on this machine
    priority: 60
    timeout: 180
    prompt_via_stdin: false
    skills: ["investigate", "fix", "refactor"]

# ---------------------------------------------------------------------------
# Semantic Memory (pgvector embeddings + similar ticket retrieval)
# ---------------------------------------------------------------------------
memory:
  embedding_model: "bge-m3"
  embedding_dimensions: 1024
  top_k: 5
  similarity_floor: 0.75
  store_on_investigation_complete: true

# ---------------------------------------------------------------------------
# Agent Definitions
# ---------------------------------------------------------------------------
agents:
  # ---- Monitoring ----
  - name: "swe_monitor"
    role: "monitor"
    description: "Scans logs and metrics for errors, creates tickets"
    model: "sonnet"
    tools: ["log_scanner", "github_issues"]
    max_concurrent_tasks: 1
    enabled: true
    node: "primary"

  # ---- Triage ----
  - name: "swe_triage"
    role: "triage"
    description: "Classifies tickets by severity and assigns to investigators"
    model: "sonnet"
    tools: ["ticket_manager"]
    max_concurrent_tasks: 3
    enabled: true
    node: "primary"

  # ---- Investigation ----
  - name: "browser_investigator"
    role: "investigator"
    description: "Diagnoses browser automation and scraping issues"
    model: "sonnet"
    tools: ["log_scanner", "code_search", "browser_debug"]
    max_concurrent_tasks: 2
    enabled: true
    node: "worker"

  - name: "db_investigator"
    role: "investigator"
    description: "Diagnoses database and query issues"
    model: "sonnet"
    tools: ["log_scanner", "code_search", "db_query"]
    max_concurrent_tasks: 1
    enabled: true
    node: "primary"

  - name: "infra_investigator"
    role: "investigator"
    description: "Diagnoses A2A hub, networking, and infrastructure issues"
    model: "sonnet"
    tools: ["log_scanner", "code_search", "health_check"]
    max_concurrent_tasks: 1
    enabled: true
    node: "primary"

  # ---- Development ----
  - name: "swe_developer"
    role: "developer"
    description: "Implements fixes and features via acpx/Claude Code"
    model: "sonnet"
    tools: ["code_editor", "acpx", "git"]
    max_concurrent_tasks: 1
    enabled: true
    node: "primary"

  # ---- Review ----
  - name: "swe_reviewer"
    role: "reviewer"
    description: "Reviews code changes and approves for testing"
    model: "sonnet"
    tools: ["code_review", "git"]
    max_concurrent_tasks: 2
    enabled: true
    node: "primary"

  # ---- Testing ----
  - name: "swe_tester"
    role: "tester"
    description: "Runs tests in sandboxed environment"
    model: "sonnet"
    tools: ["pytest", "sandbox"]
    max_concurrent_tasks: 1
    enabled: true
    node: "primary"

  # ---- Deployment ----
  - name: "swe_deployer"
    role: "deployer"
    description: "Injects fixes into production and monitors rollback"
    model: "sonnet"
    tools: ["git", "deploy", "health_check"]
    max_concurrent_tasks: 1
    enabled: true
    node: "primary"

  # ---- Documentation ----
  - name: "swe_documenter"
    role: "documenter"
    description: "Keeps docs, tracking, and architecture docs up-to-date"
    model: "sonnet"
    tools: ["code_editor", "git"]
    max_concurrent_tasks: 1
    enabled: true
    node: "primary"

  # ---- Creative / Optimisation ----
  - name: "swe_creative"
    role: "creative"
    description: "Proposes workflow optimisations and improvements"
    model: "sonnet"
    tools: ["code_search", "research", "deep_wiki"]
    max_concurrent_tasks: 1
    enabled: true
    node: "primary"
