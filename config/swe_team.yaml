providers:
  usage_governor:
    provider: adaptive
    hard_limits:
      max_agents_absolute: 10
      min_agents_absolute: 1
    operator_overrides:
    - name: anthropic_2x_window
      description: 2x capacity window from Anthropic for Claude Code
      days:
      - mon
      - tue
      - wed
      - thu
      - fri
      - sat
      - sun
      start_hour: 14
      end_hour: 8
      timezone: America/Toronto
      multiplier: 2.0
      active: true
    - name: peak_reduction
      description: Reduce during business hours to save quota
      days:
      - mon
      - tue
      - wed
      - thu
      - fri
      start_hour: 8
      end_hour: 14
      timezone: America/Toronto
      multiplier: 0.1
      active: true
    quota:
      tokens_per_5h_block: 500000
      tokens_per_day: 2400000
    concurrency:
      max_agents: 5
      tiers:
      - remaining_pct: 70
        max_agents: 5
        priority_floor: low
      - remaining_pct: 50
        max_agents: 3
        priority_floor: medium
      - remaining_pct: 30
        max_agents: 2
        priority_floor: high
      - remaining_pct: 10
        max_agents: 1
        priority_floor: critical
        allow_new_work: false
    schedule:
      timezone: America/Toronto
      windows:
      - name: weekday_peak
        days:
        - mon
        - tue
        - wed
        - thu
        - fri
        hours:
        - 9
        - 18
        concurrency_multiplier: 0.6
      - name: weekday_offpeak
        days:
        - mon
        - tue
        - wed
        - thu
        - fri
        hours:
        - 18
        - 9
        concurrency_multiplier: 1.0
      - name: weekend
        days:
        - sat
        - sun
        hours:
        - 0
        - 24
        concurrency_multiplier: 1.5
    bonus_detection:
      enabled: true
      throughput_multiplier_threshold: 1.5
    alerts:
      quota_warning_pct: 20
      quota_critical_pct: 10
      burn_rate_spike_multiplier: 2.0
      throttle_minutes: 60
  coding_engine:
    provider: claude
    timeout_seconds: 300
  sandbox:
    provider: proxmox
    gateway_url: ''
    api_key: ''
    node: IO
    default_cpu: 2
    default_ram_gb: 4
    default_disk_gb: 20
    default_ttl_hours: 2
    vmid_start: 1100
    vmid_end: 1199
    image: python:3.11-slim
    network: none
    auto_install_deps: true
    cpu_limit: 1.0
    memory_mb: 512
  workspace:
    provider: git-worktree
  env:
    provider: dotenv
