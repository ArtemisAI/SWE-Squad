auto_accept_invites: false
invite_allowlist: []
# Override via A2A_HUB_URL env var (e.g. http://<your-hub-ip>:18790)
a2a_hub_url: http://localhost:18790
ticket_store_path: data/swe_team/tickets.json
orchestrator:
  enabled: true
  cycle_interval_minutes: 30
  auto_fix: true
  thresholds:
    idle_with_work_minutes: 30
    stuck_ticket_hours: 6
    throughput_drop_percent: 50
    max_circuit_breaker_resets_per_day: 3
  vms:
  # Configure VM IPs via environment or override this section per-deployment
  - name: worker-1
    ip: ${SWE_VM_2_IP:-127.0.0.1}
    ssh_alias: worker-1
    team_id: your-bot-beta
  - name: worker-2
    ip: ${SWE_VM_3_IP:-127.0.0.1}
    ssh_alias: worker-2
    team_id: your-bot-gamma
worktree:
  base_dir: data/worktrees
  max_age_hours: 48
  max_concurrent: 10
# V2 delegation config — engine-agnostic role-to-engine mapping
delegation:
  investigator:
    engine: claude-cli
    model: sonnet
    read_only: true
    timeout: 1800
  developer:
    engine: claude-cli
    model: sonnet
    timeout: 3600
  reviewer:
    engine: claude-cli
    model: sonnet
    read_only: true
    timeout: 900

# V2 daemon config
daemon:
  heartbeat_interval_seconds: 300
  initial_prompt: "Management cycle. Steps: 1) call check_health + check_stability. 2) call ticket_list with status=pipeline to see the full pipeline in ONE call. 3) Advance ONE ticket — pick by priority (flush right-to-left, complete nearest-done first): testing with review approved→run_tests then approve_pr + merge_pr, in_review→delegate_review, investigation_complete→delegate_development, in_development with metadata.reviewVerdict=changes_requested→delegate_development (rework with review feedback), in_development with no assigned_to and no reviewVerdict→ticket_update status=investigation_complete (orphaned, reset for dev retry), investigating with no assigned_to→ticket_update status=open (orphaned reset for retry), open/triaged→delegate_investigation (skip tickets with investigationAttempts >= 3). 4) If stability=BLOCK or all engines unhealthy, send_notification and stop. Take action — call one delegation tool. Do NOT write reports or use bash. CALL THE TOOL."
  max_session_age: 86400
  graceful_shutdown_timeout: 30

governance:
  enabled: false
  max_open_critical: 100
  max_open_high: 200
  max_failing_tests: 5
  max_failing_tests_pct: 5
  require_ci_green: false
  check_interval_hours: 6
  warn_on_any_failure: true
  hard_block_pct: 10
monitor:
  enabled: false
  scan_interval_minutes: 15
  dedup_window_hours: 72
  log_directories:
  - logs/
  log_patterns:
  - ERROR
  - CRITICAL
  - Traceback
  - FAILED
  - reCAPTCHA
  - TimeoutError
  exclude_patterns:
  - swe_team
  - swe_team_runner
  - health_check
  - logs/remote
  - cron
  worker_module_map:
    browser:
    - worker-browser-2
    bot:
    - worker-bot-2
    scraper:
    - worker-hp-laptop
  remote_workers:
  - name: worker-browser-2
    ssh: worker-browser-2
    log_dir: ~/Projects/example-app/logs
  - name: worker-bot-2
    ssh: worker-bot-2
    log_dir: ~/Projects/example-app/logs
  - name: worker-hp-laptop
    ssh: worker-hp-laptop
    log_dir: ~/Projects/example-app/logs
cycle:
  severity_filter: low
  max_new_tickets_per_cycle: 10
  max_investigations_per_cycle: 20
  max_developments_per_cycle: 10
  max_open_investigating: 40
  max_investigation_workers: 8
  stale_ticket_timeouts:
    blocked_ticket_timeout_hours: 4
    blocked_ticket_escalation_hours: 24
pipeline:
  verification_window_minutes: 30
  propagation_wait_minutes: 2
models:
  t1_heavy: opus
  t2_standard: opus
  t3_fast: haiku
engine_routing:
  investigate: claudep
  triage: claudep
  develop: claude
  review: claudez
  fallback: claudez
rate_limits:
  max_retries_on_429: 5
  initial_backoff_seconds: 60
  max_backoff_seconds: 900
fallback_agents:
- name: claudep
  command: /usr/bin/claude
  args_template:
  - --print
  - '{prompt}'
  default_model: sonnet
  enabled: true
  priority: 30
  timeout: 300
  prompt_via_stdin: true
  skills:
  - investigate
  - develop
  - review
  - fix
  env_vars:
    # Override via ANTHROPIC_BASE_URL env var
    ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
- name: gemini-cli
  command: /usr/bin/gemini
  args_template:
  - -p
  - '{prompt}'
  default_model: gemini-3-pro-high
  enabled: true
  priority: 50
  timeout: 180
  prompt_via_stdin: false
  skills:
  - investigate
  - review
  - dashboard
  - websearch
- name: opencode
  command: /usr/local/bin/opencode
  args_template:
  - run
  - -m
  - '{prompt}'
  default_model: ''
  enabled: false
  priority: 60
  timeout: 180
  prompt_via_stdin: false
  skills:
  - investigate
  - fix
  - refactor
routing:
  external_agents_enabled: false
  complexity_threshold: 50
  capability_map:
    investigation: gemini-cli
    code_generation: opencode
memory:
  embedding_model: bge-m3
  embedding_dimensions: 1024
  top_k: 5
  similarity_floor: 0.75
  store_on_investigation_complete: true
  # Memory worker service — flip enabled to true once the worker is deployed
  enabled: false
  worker_host: 127.0.0.1
  worker_port: 37777
agents:
- name: swe_monitor
  role: monitor
  description: Scans logs and metrics for errors, creates tickets
  model: sonnet
  tools:
  - log_scanner
  - github_issues
  max_concurrent_tasks: 1
  enabled: true
  node: primary
- name: swe_triage
  role: triage
  description: Classifies tickets by severity and assigns to investigators
  model: sonnet
  tools:
  - ticket_manager
  max_concurrent_tasks: 3
  enabled: true
  node: primary
- name: browser_investigator
  role: investigator
  description: Diagnoses browser automation and scraping issues
  model: sonnet
  tools:
  - log_scanner
  - code_search
  - browser_debug
  max_concurrent_tasks: 2
  enabled: true
  node: worker
- name: db_investigator
  role: investigator
  description: Diagnoses database and query issues
  model: sonnet
  tools:
  - log_scanner
  - code_search
  - db_query
  max_concurrent_tasks: 1
  enabled: true
  node: primary
- name: infra_investigator
  role: investigator
  description: Diagnoses A2A hub, networking, and infrastructure issues
  model: sonnet
  tools:
  - log_scanner
  - code_search
  - health_check
  max_concurrent_tasks: 1
  enabled: true
  node: primary
- name: swe_developer
  role: developer
  description: Implements fixes and features via acpx/Claude Code
  model: sonnet
  tools:
  - code_editor
  - acpx
  - git
  max_concurrent_tasks: 1
  enabled: true
  node: primary
- name: swe_reviewer
  role: reviewer
  description: Reviews code changes and approves for testing
  model: sonnet
  tools:
  - code_review
  - git
  max_concurrent_tasks: 2
  enabled: true
  node: primary
- name: swe_qa
  role: qa
  description: Runs build verification, visual tests, and regression checks before
    merge
  model: sonnet
  tools:
  - pytest
  - playwright
  - npm
  max_concurrent_tasks: 2
  enabled: true
  node: primary
- name: swe_tester
  role: tester
  description: Runs tests in sandboxed environment
  model: sonnet
  tools:
  - pytest
  - sandbox
  max_concurrent_tasks: 1
  enabled: true
  node: primary
- name: swe_deployer
  role: deployer
  description: Injects fixes into production and monitors rollback
  model: sonnet
  tools:
  - git
  - deploy
  - health_check
  max_concurrent_tasks: 1
  enabled: true
  node: primary
- name: swe_documenter
  role: documenter
  description: Keeps docs, tracking, and architecture docs up-to-date
  model: sonnet
  tools:
  - code_editor
  - git
  max_concurrent_tasks: 1
  enabled: true
  node: primary
- name: swe_creative
  role: creative
  description: Proposes workflow optimisations and improvements
  model: sonnet
  tools:
  - code_search
  - research
  - deep_wiki
  max_concurrent_tasks: 1
  enabled: true
  node: primary

