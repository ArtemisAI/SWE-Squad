scheduler:
  enabled: true
  tick_interval_seconds: 30
  max_workers: 3
  peak_start_hour: 13
  peak_end_hour: 19
  peak_days: 0,1,2,3,4
  default_jobs:
  - name: SWE monitoring cycle
    schedule_type: cron
    cron_expression: '*/15 * * * *'
    priority: critical
    instructions: run_cycle
    respect_peak_hours: false
  - name: Daily summary report
    schedule_type: cron
    cron_expression: 0 8 * * *
    priority: normal
    instructions: daily_summary
  - name: PR sync to knowledge graph
    schedule_type: cron
    cron_expression: '*/5 * * * *'
    priority: low
    instructions: pr_sync
throttle:
  enabled: true
  time_bands:
    peak_reduction:
      start_hour: 7
      end_hour: 10
      timezone: America/New_York
      multiplier: 0.1
    overnight_low:
      start_hour: 0
      end_hour: 6
      timezone: America/New_York
      multiplier: 0.3
    daytime:
      start_hour: 10
      end_hour: 24
      timezone: America/New_York
      multiplier: 0.5
  capacity:
    warn_usage_pct: 80
    warn_days_remaining: 2
    warn_multiplier: 0.5
    critical_usage_pct: 95
    critical_multiplier: 0.1
  demand:
    high_backlog_threshold: 200
    high_backlog_multiplier: 1.5
    critical_backlog_threshold: 20
    surge_multiplier: 2.0
execution:
  mode: adaptive
  profiles:
    base:
      max_concurrent_investigations: 2
      max_concurrent_developments: 1
      cycle_interval_seconds: 900
    burst:
      max_concurrent_investigations: 2
      max_concurrent_developments: 3
      cycle_interval_seconds: 300
    max:
      max_concurrent_investigations: 3
      max_concurrent_developments: 3
      cycle_interval_seconds: 120
  adaptive:
    schedule:
    - hours: 0-8
      profile: burst
    - hours: 8-17
      profile: base
    - hours: 17-24
      profile: burst
    backlog_burst_threshold: 30
    backlog_max_threshold: 80
    quota_multiplier: 1.0
