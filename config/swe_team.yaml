  test_runner:
  - PATH
  - HOME
  - LANG
  - PYTHONPATH
  - SWE_TEAM_ID
  reviewer:
  - PATH
  - HOME
  - LANG
  - PYTHONPATH
  - SWE_TEAM_ID
  - SWE_GITHUB_REPO
  - GH_TOKEN
  claude_cli:
  - PATH
  - HOME
  - LANG
  - PYTHONPATH
  - ANTHROPIC_AUTH_TOKEN
