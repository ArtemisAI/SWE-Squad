version: 1
updated_at: 2026-03-24
endpoint: https://your-llm-proxy.example.com/v1
notes:
  - Use short names for UI/CLI cleanliness; route to full model IDs at runtime.
  - Catalog aligned to live NewAPI /models on 2026-03-24.
  - Legacy model IDs may fail with model_price_error and are intentionally removed from defaults.

defaults:
  claudep_default_model: qwen3
  kimi_min_safe_max_tokens: 128
  model_provider: openai

models:
  - short_name: qwen3
    model_id: qwen3-coder-next:cloud
    provider: openai
    status: healthy
    capabilities:
      chat: true
      streaming: true
      tool_calling: true
      multimodal_input: true
      reasoning_visible: true
    role_hint: primary coder

  - short_name: deepseek-v3.2
    model_id: deepseek-v3.2:cloud
    provider: openai
    status: healthy
    capabilities:
      chat: true
      streaming: true
      tool_calling: false
      multimodal_input: true
      reasoning_visible: false
    role_hint: reasoning and fallback

  - short_name: kimi-k2-1t
    model_id: kimi-k2:1t-cloud
    provider: openai
    status: healthy
    caveats:
      - use max_tokens >= 128 for reliable visible output
    capabilities:
      chat: true
      streaming: true
      tool_calling: true
      multimodal_input: false
      reasoning_visible: true
    role_hint: long-context and reasoning

