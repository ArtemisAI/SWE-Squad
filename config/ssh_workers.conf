# ═══════════════════════════════════════════════════════════════════════════════
# SSH Config — SWE-Squad Worker Access (LinkedAi nodes)
# ═══════════════════════════════════════════════════════════════════════════════
# Purpose:  Scoped SSH config for SWE-Squad remote log collection and debugging.
#           ONLY the 4 LinkedAi worker nodes are reachable through this config.
#
# Key:      ~/.ssh/swe_workers_linkedai_key (ed25519, deployed to workers only)
# Usage:    ssh -F config/ssh_workers.conf <alias>
#           rsync -e "ssh -F config/ssh_workers.conf" ...
#
# SECURITY: This config is intentionally restrictive. It does NOT include:
#           - Niobe (primary orchestrator) — NEVER accessible from SWE-Squad
#           - Proxmox hypervisors (zion, io, mc) — root-level, off-limits
#           - Non-LinkedAi VMs — separate project scope
#
# To add a new worker: add a Host block below AND deploy the pubkey:
#   ssh-copy-id -i ~/.ssh/swe_workers_linkedai_key.pub agent@<new-ip>
# ═══════════════════════════════════════════════════════════════════════════════


# ─── GLOBAL DEFAULTS (strict) ────────────────────────────────────────────────
Host *
    IdentitiesOnly yes
    IdentityFile ~/.ssh/swe_workers_linkedai_key
    User agent
    ConnectTimeout 5
    BatchMode yes
    ServerAliveInterval 60
    ServerAliveCountMax 3
    StrictHostKeyChecking accept-new


# ─── LINKEDAI WORKER NODES ───────────────────────────────────────────────────

# browser-1 — LinkedIn scraping node (Xvfb, CDP :9222)
Host linkedai-browser-1
    HostName 100.86.74.85

# browser-2 — Application submission ONLY (Xvfb, CDP :9222)
Host linkedai-browser-2
    HostName 100.123.214.64

# bot-2 — Google Jobs scraping (Xvfb, CDP :9222)
Host linkedai-bot-2
    HostName 100.74.77.79

# hp-laptop — Legacy scraper worker
Host linkedai-hp-laptop
    HostName 100.81.246.113
