[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-squad"
version = "0.1.0"
description = "Autonomous SWE agents — monitor, triage, investigate, and fix issues."
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/ArtemisAI/SWE-Squad"
Repository = "https://github.com/ArtemisAI/SWE-Squad"
"Bug Tracker" = "https://github.com/ArtemisAI/SWE-Squad/issues"

[project.optional-dependencies]
embeddings = ["openai"]
supabase = []  # uses stdlib urllib — no extra deps
cli = ["rich>=13.0"]

[project.scripts]
swe-squad = "scripts.ops.swe_team_runner:main"
swe-cli = "scripts.ops.swe_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]
